<text x="483" y="920" font-size="17" fill="#152d42">FK id_orden : INTEGER</text>
<text x="483" y="949" font-size="17" fill="#152d42">concepto : TEXT</text>
    </g><text x="30" y="320" font-size="18">Esquema: mt_reparaciones. r6, r10 y r11 no comparten ordenes.</text>
    <text x="420" y="420" font-size="18">El reto 10 usa sus propias rutinas y datos.</text>
    <text x="420" y="460" font-size="18">El costo base no se sobrescribe al cerrar.</text>
    </g></svg>