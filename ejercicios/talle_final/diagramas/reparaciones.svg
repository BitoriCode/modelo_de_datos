<text x="43" y="470" font-size="17" fill="#152d42">costo_base : NUMERIC(10,2)</text>
<text x="43" y="499" font-size="17" fill="#152d42">total_final : NUMERIC(10,2) NULL</text>
<text x="43" y="528" font-size="17" fill="#152d42">estado : TEXT</text>
    </g>
