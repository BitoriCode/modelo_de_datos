    <text x="630" y="105" text-anchor="middle" font-size="17" font-weight="bold" fill="white">r6_auditoria</text>
    <text x="483" y="141" font-size="17" fill="#152d42">PK id_auditoria : IDENTITY</text>
<text x="483" y="170" font-size="17" fill="#152d42">FK id_orden : INTEGER</text>
<text x="483" y="199" font-size="17" fill="#152d42">antes : TEXT</text>
<text x="483" y="228" font-size="17" fill="#152d42">despues : TEXT</text>
    </g>
<g>
