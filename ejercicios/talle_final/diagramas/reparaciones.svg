      <text x="400" y="845.25" text-anchor="middle" font-size="16"
      fill="#243b53" paint-order="stroke" stroke="white" stroke-width="5">1 : 0..N</text><g>
    <rect x="30" y="80" width="300" height="110" rx="7" fill="#f7fafc" stroke="#51677d" stroke-width="2"/>
    <path d="M37 80 H323 Q330 80 330 87
