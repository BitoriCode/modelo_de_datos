<text x="155" y="166" text-anchor="middle" font-weight="bold">SALA</text>
<text x="155" y="201" text-anchor="middle">id_sala, nombre</text>
<text x="550" y="166" text-anchor="middle" font-weight="bold">PIEZA</text>
