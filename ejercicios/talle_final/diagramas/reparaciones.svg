<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1010" viewBox="0 0 1120 1010" role="img" aria-labelledby="title">
    <title id="title">Reparaciones | estados separados para cada reto</title>
    <rect width="100%" height="100%" fill="white"/>
