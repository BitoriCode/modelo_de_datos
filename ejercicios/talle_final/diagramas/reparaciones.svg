    <text x="180" y="105" text-anchor="middle" font-size="17" font-weight="bold" fill="white">r6_orden</text>
    <text x="43" y="141" font-size="17" fill="#152d42">PK id_orden : INTEGER</text>
<text x="43" y="170" font-size="17" fill="#152d42">estado : TEXT</text>
    </g>
<g>
